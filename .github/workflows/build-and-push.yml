# ================================================================
# MiniMax H3 - GitHub Actions 一键构建 + 推送
# ================================================================
# 即使你本地没有 Docker,也能用 GitHub Actions 免费构建并推送!
#
# 流程:
#   1. 把整个项目 push 到 GitHub 仓库
#   2. 在 GitHub 仓库 Settings → Secrets 添加:
#      - DOCKERHUB_USERNAME: 你的 Docker Hub 用户名
#      - DOCKERHUB_TOKEN:    你的 Docker Hub Access Token
#   3. 每次 git push 自动构建并推送到 Docker Hub
#   4. Phala Cloud 用 image: 用户名/minimax-h3-gradio:latest 拉取
#
# ================================================================

name: Build and Push to Docker Hub

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:  # 允许手动触发

env:
  IMAGE_NAME: minimax-h3-gradio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 提取版本号
        id: meta
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=latest" >> $GITHUB_OUTPUT
          fi

      - name: 构建并推送 (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建摘要
        run: |
          echo "✅ 镜像已推送:"
          echo "   ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.VERSION }}"
