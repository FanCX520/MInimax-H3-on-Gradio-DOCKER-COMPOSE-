# ================================================================
# MiniMax H3 - GitHub Actions 自动构建 + 推送到 GHCR (无需 Secrets)
# ================================================================

name: Build and Push to GHCR

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 (linux/amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          # GHCR 要求用户名小写 - 硬编码避免自动推断错误
          tags: |
            ghcr.io/fancx520/minimax-h3-gradio:latest
            ghcr.io/fancx520/minimax-h3-gradio:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.title=Qwen3-VL Gradio
          # 启用 GitHub Actions 缓存 - 大幅加速后续构建
          # 多阶段 Dockerfile 让代码修改只重 build 最后阶段
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: 镜像信息
        if: success()
        run: |
          echo "✅ 镜像已推送到 GitHub Container Registry"
          echo ""
          echo "镜像地址:"
          echo "  ghcr.io/fancx520/minimax-h3-gradio:latest"
          echo ""
          echo "在 Phala Cloud docker-compose.yml 中使用:"
          echo "  image: ghcr.io/fancx520/minimax-h3-gradio:latest"

      - name: 设置镜像包为公开 (Phala 需要匿名拉取)
        if: success()
        run: |
          PACKAGE_NAME="minimax-h3-gradio"
          echo "设置包 $PACKAGE_NAME 为公开..."
          # GitHub Packages API - 公开容器包
          curl -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/$PACKAGE_NAME" \
            -d '{"visibility":"public","public_description":"MiniMax H3 video generation - Gradio UI"}' \
            -o /tmp/package-visibility.json
          cat /tmp/package-visibility.json
          echo ""
          echo "✅ 包可见性已更新"
          echo "   镜像地址 (公开):"
          echo "   https://ghcr.io/fancx520/minimax-h3-gradio:latest"
