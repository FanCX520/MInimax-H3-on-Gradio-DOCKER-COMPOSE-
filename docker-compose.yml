# ================================================================
# Qwen3-VL-32B 视觉问答 - Phala Cloud 部署配置
# ================================================================
# 模型: FanCXZi/Qwen3-VL-32B-Instruct-ultra-uncensored-heretic-bucket
# 功能: 上传图片 + 提问 → Qwen3-VL 用文字回答
#
# ⚠️ Phala Cloud 限制:
#   - 不支持 build.context / dockerfile / env_file / host bind volumes
#   - 必须用 image: 字段 + 命名卷
#   - GPU TEE On-Demand: Stop 会删除磁盘,只能 Restart 不停止
#   - 模型 67GB 首次下载需 5-15 分钟,命名卷持久化后不再下载
#
# 🚀 部署流程:
#   第1步: GitHub Actions 自动构建并推送镜像 (已完成)
#   第2步: 在 Phala Dashboard 粘贴此 docker-compose.yml → Create
#   第3步: 等待 5-15 分钟 (首次下载 67GB 模型)
#   第4步: 访问 Phala 分配的 URL (端口 7860)
#
# 🔄 后续更新流程 (避免 100 刀重建费):
#   git push → Actions 重建镜像 → Phala Restart CVM (免费,不删磁盘)
# ================================================================

version: '3.8'

services:
  minimax-h3-gradio:
    # ✅ 从 GitHub Container Registry (GHCR) 拉取预构建镜像
    # 镜像由 GitHub Actions 自动构建并推送,无需任何 secrets 配置
    image: ghcr.io/fancx520/minimax-h3-gradio:latest
    pull_policy: always

    container_name: minimax-h3-gradio
    restart: unless-stopped

    # Phala GPU TEE 支持 (NVIDIA H100/H200/B300)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute]

    # Phala 老版兼容 (取消注释如果上面不工作)
    # runtime: nvidia

    ports:
      - "7860:7860"

    stdin_open: true
    tty: true

    # 环境变量 (直接写,不要用 env_file)
    environment:
      # GPU / CUDA
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video,graphics
      - CUDA_HOME=/usr/local/cuda
      - LD_LIBRARY_PATH=/usr/local/cuda/lib64:/usr/local/cuda/lib

      # PyTorch (兼容你日志里的 CUDA 13.0 环境)
      - TORCH_CUDA_ARCH_LIST=8.0;8.6;8.9;9.0
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512,expandable_segments:True
      - PYTHONUNBUFFERED=1

      # Gradio
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860
      - GRADIO_ANALYTICS_ENABLED=False
      - GRADIO_SHARE=False

      # 模型配置
      - MODEL_ID=FanCXZi/Qwen3-VL-32B-Instruct-ultra-uncensored-heretic-bucket
      - HF_HOME=/app/models/huggingface
      - HUGGINGFACE_HUB_CACHE=/app/models/huggingface
      - TRANSFORMERS_CACHE=/app/models/huggingface

    # ✅ 使用命名卷 (Phala 要求,不能用 ./outputs 这种 host bind)
    # 所有持久化数据都在 /app/models 一个卷里 - 简化磁盘管理
    volumes:
      - minimax-models:/app/models
      - minimax-outputs:/app/outputs
      - minimax-uploads:/app/uploads

    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7860/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 900s   # 首次启动要下 67GB 模型,给 15 分钟

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  minimax-models:    # HuggingFace 模型缓存 (~67GB) - 重启不丢失
  minimax-outputs:
  minimax-uploads:
